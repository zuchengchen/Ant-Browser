name: Publish macOS Packages

on:
  workflow_call:
    inputs:
      version:
        description: 可选的预期版本，须与仓库中的包版本一致
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 可选的预期版本，须与仓库中的包版本一致
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve package version
        id: version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(python scripts/resolve-release-version.py --ref-type "$GITHUB_REF_TYPE" --ref-name "$GITHUB_REF_NAME" --version "$EXPECTED_VERSION")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "package version: $version"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build unsigned macOS package
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          args=(--arch "${{ matrix.arch }}")
          if [[ -n "$VERSION" ]]; then
            args+=(--version "$VERSION")
          fi
          bash publish/mac/publish-mac.sh "${args[@]}"

      - name: Validate app bundle
        run: |
          set -euo pipefail
          app_path="$(ls -1d publish/output/AntBrowser-*-macos-${{ matrix.arch }}.app | head -n 1)"
          zip_path="$(ls -1 publish/output/AntBrowser-*-macos-${{ matrix.arch }}.zip | head -n 1)"
          echo "Validating: $app_path"
          test -x "$app_path/Contents/MacOS/ant-chrome"
          test -x "$app_path/Contents/MacOS/bin/xray"
          test -x "$app_path/Contents/MacOS/bin/sing-box"
          plutil -lint "$app_path/Contents/Info.plist"
          python - "$app_path/Contents/Info.plist" <<'PYTHON'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as plist:
              handlers = plistlib.load(plist, fmt=plistlib.FMT_XML).get("CFBundleURLTypes", [])
          if not any("ant-browser" in handler.get("CFBundleURLSchemes", []) for handler in handlers):
              sys.exit("Missing ant-browser URL scheme in the packaged application")
          PYTHON
          ditto -x -k "$zip_path" /tmp/ant-browser-macos-validate
          test -x "/tmp/ant-browser-macos-validate/$(basename "$app_path")/Contents/MacOS/ant-chrome"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ant-browser-macos-${{ matrix.arch }}
          path: |
            publish/output/AntBrowser-*-macos-${{ matrix.arch }}.app
            publish/output/AntBrowser-*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
