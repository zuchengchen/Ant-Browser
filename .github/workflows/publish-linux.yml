name: Publish Linux Packages

on:
  workflow_call:
    inputs:
      version:
        description: 可选的预期版本，须与仓库中的包版本一致
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 可选的预期版本，须与仓库中的包版本一致
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve package version
        id: version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(python scripts/resolve-release-version.py --ref-type "$GITHUB_REF_TYPE" --ref-name "$GITHUB_REF_NAME" --version "$EXPECTED_VERSION")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "package version: $version"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            dpkg-dev \
            git \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libxcb1-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            python3 \
            tar

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify runtime files
        run: bash tools/runtime/verify-runtime.sh linux-${{ matrix.arch }}

      - name: Build Linux packages
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BROWSERSLIST_IGNORE_OLD_DATA: "1"
        run: |
          set -euo pipefail
          args=(--arch "${{ matrix.arch }}")
          if [[ -n "${VERSION:-}" ]]; then
            args+=(--version "$VERSION")
          fi
          bash publish/linux/publish-linux.sh "${args[@]}"

      - name: Validate deb package metadata
        run: |
          set -euo pipefail
          deb_file="$(ls -1 publish/output/*_${{ matrix.arch }}.deb | head -n 1)"
          echo "Validating: $deb_file"
          dpkg-deb -I "$deb_file"
          dpkg-deb -c "$deb_file" >/dev/null
          deb_root="$(mktemp -d)"
          dpkg-deb -x "$deb_file" "$deb_root"
          depends="$(dpkg-deb -f "$deb_file" Depends)"
          if readelf --dynamic --wide "$deb_root/opt/ant-browser/ant-chrome" | grep -F '[libwebkit2gtk-4.1.so.0]'; then
            [[ ", $depends," == *", libwebkit2gtk-4.1-0,"* && "$depends" != *libwebkit2gtk-4.0-37* ]]
          else
            readelf --dynamic --wide "$deb_root/opt/ant-browser/ant-chrome" | grep -F '[libwebkit2gtk-4.0.so.37]'
            [[ ", $depends," == *", libwebkit2gtk-4.0-37,"* && "$depends" != *libwebkit2gtk-4.1-0* ]]
          fi
          desktop="$deb_root/usr/share/applications/ant-browser.desktop"
          grep -Fx 'Exec=/opt/ant-browser/ant-chrome %u' "$desktop"
          grep -Fx 'MimeType=x-scheme-handler/ant-browser;' "$desktop"

      - name: Validate tar package layout
        run: |
          set -euo pipefail
          tar_file="$(ls -1 publish/output/AntBrowser-*-linux-${{ matrix.arch }}.tar.gz | head -n 1)"
          validate_dir="$(mktemp -d)"
          echo "Validating: $tar_file"
          tar -xzf "$tar_file" -C "$validate_dir"
          test -x "$validate_dir/ant-chrome"
          test -x "$validate_dir/bin/xray"
          test -x "$validate_dir/bin/sing-box"
          test -f "$validate_dir/config.yaml"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ant-browser-linux-${{ matrix.arch }}
          path: |
            publish/output/*_${{ matrix.arch }}.deb
            publish/output/*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
